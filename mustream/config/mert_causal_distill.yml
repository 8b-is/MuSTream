# MERT causal distillation: frozen bidirectional MERT teacher -> causal
# (streaming) student.
#
#     python train_mert_causal_distill.py --args.load=config/mert_causal_distill.yml

# Trainer
$vars:
    total_steps: 100000

seed: 42
train_steps: $total_steps
val_interval: 1000
overfit_batches: 0
wandb_project: "mustream"
log_every_n_steps: 1
limit_val_batches: 128
checkpoint_interval: 5000
checkpoint_metric: "val/total_loss"
checkpoint_mode: "min"
checkpoint_top_k: 1
load_from_latest_checkpoint: true
accelerator: "auto"
devices: "auto"
num_nodes: 1
precision: "bf16-mixed"
strategy: "auto"
compile: true

# Data
batch_size: 128 # 64 (330M), 128 (95M), 128 (26M)
num_workers: 8

##### MTG-Jamendo (h5)
h5_root: 'path/to/MTG-Jamendo-h5/MTG-Jamendo'
h5_shards: 256
train_split: 'data_splits/mtg_jamendo/train.pkl'
valid_split: 'data_splits/mtg_jamendo/val.pkl'

duration: 10.0
sample_rate: 24000
hop_length: 320

# Teacher. mert_model is always required: it is the default teacher and supplies
# the shared config / waveform normalization.
mert_model: 'm-a-p/MERT-v1-95M'  # m-a-p/MERT-v1-95M, m-a-p/MERT-v1-330M
# Optional: use a small bidirectional student (train_mert_size_distill.py
# checkpoint) as the teacher instead. teacher_num_attention_heads defaults to
# student_num_attention_heads.
# teacher_checkpoint: 'ckpt/runs/bidirectional_26M/step=<N>.ckpt'   # your own size-distillation run
# teacher_num_attention_heads: 8

# Student.
#   'streaming'       MERT's own width, initialized from mert_model.
#   'small_streaming' small width (modeling/mert/small_mert.py).
student_model: 'streaming'
streaming_context: 750               # KV-cache window in frames (75 fps); 750 = 10 s
student_positional_embedding: 'rope' # 'rope' (recommended) | 'sin'; must match when resuming

# small_streaming only (STaRHuBERT-L defaults; unset num_hidden_layers = teacher's depth).
student_hidden_size: 432
student_intermediate_size: 1392
student_num_attention_heads: 8
student_num_hidden_layers: 12
# small_streaming + teacher_checkpoint only: warm-start from the teacher's
# weights (student_* must then match the teacher). false = random init.
student_init_from_teacher: true

# Block-causal lookahead C in frames: each frame sees up to C-1 future frames
# (C=15 -> 0.2 s latency). 1 = strictly causal. Must match when resuming.
student_lookahead_block: 15

# Local-interval teacher (lit_module/distill_targets.py): the teacher only sees
# a local interval, so its future context is limited to at most
# teacher_supervise_frames - 1 + teacher_predict_frames frames.
teacher_window_frames: 375     # interval length in frames (375 = 5 s); 0 = full-crop teacher
teacher_supervise_frames: 15   # supervised frames at each interval's end; multiple of student_lookahead_block
teacher_windows_per_crop: 4    # intervals per crop per step
teacher_predict_frames: 0      # extra future frames the teacher sees past each block; 0 = reachable target
teacher_prefix_windows: false  # training only: also supervise the first (window - supervise) frames of the stream

# Loss
distill_layer: 'all'             # 'all' | 'final' | 'average' | int layer index
distill_intermediate_weight: 1.0 # 'all' only: weight of layers 0..-2
distill_final_weight: 1.0        # 'all' only: weight of the final layer
cosine_loss_weight: 1.0          # both losses are always logged; 0.0 = monitor only
l2_loss_weight: 0.1

# Optimizer
AdamW.lr: !!float 1e-4
AdamW.weight_decay: !!float 1e-2

# Scheduler (a resumed run keeps its saved scheduler values)
LinearWarmupCosineDecay.warmup_iters: 2000
LinearWarmupCosineDecay.total_iters: $total_steps
LinearWarmupCosineDecay.eta_min: !!float 1e-6

# Periodic chord / beat linear-probe evaluation on the student (evaluate_mert_distill.py)
MERTChordEvaluator.enable: false
MERTChordEvaluator.eval_interval: 5000
MERTChordEvaluator.split_dir: 'chord_recognition/data_splits/splits'
MERTChordEvaluator.vocab_file: 'chord_recognition/data_splits/dictionary_121.pkl'
MERTChordEvaluator.crop_duration: 10.0
MERTChordEvaluator.pool_factor: 5
MERTChordEvaluator.probe_epochs: 10
MERTChordEvaluator.mert_layer: 'average'
MERTChordEvaluator.hidden_dim: 512
MERTChordEvaluator.probe_lr: !!float 1e-3
MERTChordEvaluator.batch_size: 8
MERTChordEvaluator.num_workers: 4

MERTBeatEvaluator.enable: false
MERTBeatEvaluator.eval_interval: 5000
MERTBeatEvaluator.audio_dir: 'path/to/beat_eval/audio'
MERTBeatEvaluator.annotation_dir: 'path/to/beat_eval/annotations'
MERTBeatEvaluator.split_dir: 'beat_tracking/data_splits/splits'
MERTBeatEvaluator.crop_duration: 10.0
MERTBeatEvaluator.pool_factor: 1
MERTBeatEvaluator.mert_layer: 'average'
MERTBeatEvaluator.probe_epochs: 10
MERTBeatEvaluator.hidden_dim: 512
MERTBeatEvaluator.probe_lr: !!float 1e-3
MERTBeatEvaluator.batch_size: 8
MERTBeatEvaluator.num_workers: 4
