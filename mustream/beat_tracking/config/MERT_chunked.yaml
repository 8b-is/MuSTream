# data: audio_dir/<id>.<ext> + annotation_dir/<id>/beat.lab; ids come from split_dir/{train,val,test}.txt
audio_dir:            path/to/audio
annotation_dir:       path/to/annotations
split_dir:            data_splits/splits
audio_ext:            wav

train_ratio:          0.8          # only used to auto-build a split when split_dir has none
val_ratio:            0.1          # only used to auto-build a split when split_dir has none
split_seed:           42           # only used to auto-build a split when split_dir has none
crop_duration:        10.0         # training crop length, seconds
target_widen:         1        # widen each labeled frame by +/- this many frames (0 = single hard frame)

# Chunked inference: MERT sees independent non-overlapping chunks of this many seconds.
# chunk_duration * 75 (fps at pool_factor 1) should be a whole number, e.g. 0.2 -> 15 frames.
chunk_duration:       0.2

# Backbone (frozen). Switch the whole block at once (A: 330M, B: 95M, C: 26M student).
# For C, mert_align_checkpoint (a train_mert_size_distill.py checkpoint) is required,
# MERT_model must be the family it was distilled from, and student_* must match that run.

# --- A. pretrained, MERT-330M ---
backbone:             pretrained
MERT_model:           m-a-p/MERT-v1-330M
emb_dim:              1024

# --- B. pretrained, MERT-95M ---
# backbone:             pretrained
# MERT_model:           m-a-p/MERT-v1-95M
# emb_dim:              768

# --- C. small_bidirectional, 26M student ---
# backbone:                    small_bidirectional
# MERT_model:                  m-a-p/MERT-v1-95M   # base family only; must match the checkpoint
# emb_dim:                     432                 # = student_hidden_size
# mert_align_checkpoint:       ../ckpt/runs/bidirectional_26M/step=<N>.ckpt   # your own train_mert_size_distill.py run; not released
# student_hidden_size:         432
# student_intermediate_size:   1392
# student_num_attention_heads: 8

sample_rate:          24000
hop_size:             320
pool_factor:          1        # 1 = native 75 fps; >1 mean-pools that many frames together
mert_layer:           average  # 'average' or an int layer index (0..24 for 330M, 0..12 for 95M/26M)

# probe head / loss
model_type:           LSTM      # 'MLP' (per-frame), 'LSTM' (unidirectional) or 'Transformer' (causal)
hidden_dim:           512     # MLP only. null -> single linear layer; int -> one ReLU hidden layer
pos_weight_beat:      1.0      # BCEWithLogitsLoss pos_weight for beats
pos_weight_downbeat:  3.0      # BCEWithLogitsLoss pos_weight for downbeats

# Transformer only
transformer_d_model:               256
transformer_num_heads:              4
transformer_num_layers:             4
transformer_dim_feedforward:     1024
transformer_context:              null  # max attention lookback in frames; null = unbounded within a crop
transformer_positional_embedding: rope

# LSTM only
lstm_hidden_dim:      256
lstm_num_layers:      2
lstm_dropout:         0.0     # between LSTM layers; ignored if lstm_num_layers == 1

# training
epochs:               30
batch_size:           32
num_workers:          8
lr:                   1e-3
seed:                 42
device:               'cuda:0'
ckpt_interval:        5

# evaluation / post-processing (eval only; no retraining needed to change)
#   'minimal'       -- peak-picking; streamable (+/-3 frames lookahead)
#   'dbn'           -- madmom DBN, offline (whole-track Viterbi); needs madmom
#   'dbn_blocksync' -- same DBN, decoded per backbone output block; streamable, no added latency
postproc_type:        dbn_blocksync

# 'dbn_blocksync' block size in frames; 'auto' reads it from the backbone (recommended)
# dbn_block:          auto

# DBN tempo-change penalty (sweep with sweep_postproc.py --transition-lambda)
# dbn_transition_lambda: 100

# Pin the bar length (3 or 4) for 'dbn_blocksync'; unset = decided causally
# dbn_beats_per_bar:  4

# logging
use_wandb:            false
wandb_project:        beat-tracking
wandb_entity:         null
